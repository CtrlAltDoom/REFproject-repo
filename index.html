<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procedural Castle Run</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="overlay">
      <div class="panel" id="start-panel">
        <h1>Chromatic Castle</h1>
        <p>
          Explore the shimmering halls, collect the four crystal shards, heed the
          mirrors, and survive the teleport pit.
        </p>
        <button id="start-button">Play</button>
        <div class="controls">
          <h2>Controls</h2>
          <ul>
            <li>WASD / Arrow keys: Move</li>
            <li>Mouse: Look</li>
            <li>Space: Dash burst</li>
          </ul>
        </div>
      </div>
      <div class="panel" id="end-panel" hidden>
        <h1>Castle Cleared</h1>
        <p id="summary"></p>
        <button id="replay-button">Play Again</button>
      </div>
    </div>
    <div id="hud" hidden>
      <div id="shard-counter">Shards: 0 / 4</div>
      <div id="hint-text"></div>
      <div id="crosshair"></div>
    </div>
    <div id="fade"></div>
    <canvas id="scene"></canvas>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
